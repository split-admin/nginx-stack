version: "3.8"

services:

  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    networks:
      - mi_signes_networks

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-letsencrypt
    restart: unless-stopped
    environment:
      - DEFAULT_EMAIL=pllsolutiontech@outlook.es
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    networks:
      - mi_signes_networks
    depends_on:
      - nginx-proxy


  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - mi_signes_networks
    environment:
      - VIRTUAL_HOST=dev-pllsolutions.ddns.net
      - VIRTUAL_PATH=/prometheus
      - LETSENCRYPT_HOST=dev-pllsolutions.ddns.net
      - LETSENCRYPT_EMAIL=pllsolutiontech@outlook.es
      - VIRTUAL_PORT=9090

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - VIRTUAL_HOST=dev-pllsolutions.ddns.net
      - VIRTUAL_PATH=/grafana
      - LETSENCRYPT_HOST=dev-pllsolutions.ddns.net
      - LETSENCRYPT_EMAIL=pllsolutiontech@outlook.es
      - VIRTUAL_PORT=3000
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    networks:
      - mi_signes_networks

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  mi_signes_networks:
    external: true
